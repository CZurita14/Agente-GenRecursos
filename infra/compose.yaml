name: ${COMPOSE_PROJECT_NAME:-genrecursos-app}

x-backend: &backend
  image: ${IMAGEN_BACKEND:-genrecursos-backend:local}
  build:
    context: ..
    dockerfile: infra/Dockerfile.backend
    target: runtime
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp:size=134217728,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  mem_limit: 1536m
  init: true
  environment: &entorno
    DATABASE_URL: postgresql://${POSTGRES_USER:?Configura POSTGRES_USER}:${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?Configura POSTGRES_DB}
    LLM_BASE_URL: ${LLM_BASE_URL:?Configura LLM_BASE_URL}
    LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen3-8B-AWQ}
    LLM_API_KEY: ${LLM_API_KEY:-no-se-necesita}
    LLM_MAX_CONCURRENCIA: ${LLM_MAX_CONCURRENCIA:-1}
    LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-120}
    LLM_TIMEOUT_REVISOR_S: ${LLM_TIMEOUT_REVISOR_S:-240}
    LEASE_S: ${LEASE_S:-360}
    AGENTES_DIR: /app/agentes
    API_ORIGEN: ${API_ORIGEN:?Configura API_ORIGEN}
    ENTORNO: ${ENTORNO:-produccion}
    AUTH_SECRETO: ${AUTH_SECRETO:?Configura AUTH_SECRETO}
    SMTP_MODO: ${SMTP_MODO:-deshabilitado}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_REMITENTE: ${SMTP_REMITENTE:-}
    SMTP_USUARIO: ${SMTP_USUARIO:-}
    SMTP_CLAVE: ${SMTP_CLAVE:-}
    ADMINISTRADORES: ${ADMINISTRADORES:-[]}
    PROXIES_CONFIABLES: '["${IP_PROXY:-172.31.250.2}/32"]'
    PDF_MAX_BYTES: 10485760
    PDF_TIMEOUT_S: 20
    PDF_MEMORIA_MB: 512
    PDF_RECEPCION_TIMEOUT_S: 30
    API_JSON_MAX_BYTES: 1048576
    API_JSON_TIMEOUT_S: 30
    MIGRAR_AL_INICIO: "0"
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  db:
    image: pgvector/pgvector:pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
    command: [postgres, -c, log_statement=none, -c, log_min_error_statement=panic, -c, log_parameter_max_length=0, -c, log_parameter_max_length_on_error=0, -c, log_error_verbosity=terse]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Configura POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Configura POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}
    volumes: [datos:/var/lib/postgresql]
    networks: [datos]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  migrar:
    <<: *backend
    command: [python, -m, app.operacion, migrar]
    networks: [datos]
    depends_on:
      db: {condition: service_healthy}
    restart: "no"

  api:
    <<: *backend
    networks: [datos, borde, salida]
    depends_on:
      migrar: {condition: service_completed_successfully}
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/salud/listo',timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

  worker:
    <<: *backend
    command: [python, worker.py]
    networks: [datos, salida]
    depends_on:
      migrar: {condition: service_completed_successfully}
    restart: unless-stopped
    stop_grace_period: 600s
    healthcheck:
      test: [CMD, python, -m, app.operacion, salud-worker]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    image: ${IMAGEN_WEB:-genrecursos-web:local}
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      target: runtime
    networks: [borde]
    read_only: true
    tmpfs:
      - /tmp:size=33554432,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/salud"]
      interval: 15s
      timeout: 3s
      retries: 4
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  proxy:
    image: nginx:stable-alpine@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp:size=33554432,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    entrypoint: [/bin/sh, -ec]
    command:
      - 'envsubst ''$${DOMINIO} $${PUERTO_HTTPS}'' < /etc/nginx/proxy.conf.template > /tmp/nginx.conf; exec nginx -c /tmp/nginx.conf -g "daemon off;"'
    environment:
      DOMINIO: ${DOMINIO:?Configura DOMINIO}
      PUERTO_HTTPS: ${PUERTO_HTTPS:-8443}
    ports:
      - "${IP_PUBLICACION:-127.0.0.1}:${PUERTO_HTTP:-8080}:8080"
      - "${IP_PUBLICACION:-127.0.0.1}:${PUERTO_HTTPS:-8443}:8443"
    volumes:
      - type: bind
        source: ./nginx/proxy.conf.template
        target: /etc/nginx/proxy.conf.template
        read_only: true
      - type: bind
        source: ${TLS_DIR:?Configura TLS_DIR}
        target: /etc/tls
        read_only: true
    networks:
      borde: {ipv4_address: "${IP_PROXY:-172.31.250.2}"}
      publica: {}
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, --no-check-certificate, -q, -O, /dev/null, "https://127.0.0.1:8443/salud"]
      interval: 15s
      timeout: 3s
      retries: 4
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  datos: {internal: true}
  borde:
    internal: true
    ipam:
      # Las direcciones automáticas (api, web) salen solo de ip_range: así nunca toman
      # la IP fija del proxy, que es la única que la API acepta como proxy confiable.
      config: [{subnet: "${RED_PROXY:-172.31.250.0/28}", ip_range: "${RANGO_DINAMICO:-172.31.250.8/29}"}]
  salida: {}
  # Docker no publica puertos de un contenedor que solo está en redes internas:
  # el proxy necesita esta red (solo él) para que 80/443 lleguen desde el host.
  publica: {}

volumes:
  datos: {}
